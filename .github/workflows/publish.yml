name: Publish to NPM

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
      contents: read
      id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install -g npm@latest && npm ci

      - name: Publish to NPM
        run: npm stage publish
